[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-receipt-extraction"
version = "0.1.0"
description = "Turn receipt and invoice images into validated JSON with a LoRA-fine-tuned small vision-language model, escalating only uncertain documents to an expensive LLM."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
train = [
  "torch>=2.2", "torchvision", "transformers>=4.48", "datasets>=2.19", "accelerate>=0.30",
  "mlflow>=2.14", "pillow>=10.0", "peft>=0.11", "bitsandbytes>=0.43; platform_system=='Linux'",
]
baseline = ["anthropic>=1.0", "pillow>=10.0"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docextract = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
