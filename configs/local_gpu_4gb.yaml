# Local run on a 4 GB GPU (RTX 2050). Fixed weights take 2.45 GB; the heaviest examples measured 3.15 GB allocated and
# 3.65 GB reserved at this image cap, which is the practical limit of the card (the CUDA runtime needs about 0.3 GB more).
# Prefer a 16 GB GPU (Colab, Kaggle, Databricks) with configs/base.yaml: full image size, all data, larger batches.
extends: base.yaml
model:
  max_image_pixels: 313600        # about 560 x 560; 501,760 reserved 3.78 GB at the heaviest examples, too tight
train:
  device: cuda
  max_target_tokens: 300          # drops the longest-answer receipts (about 4%); their logits need the most GPU memory
  batch_size: 1                   # with logits_to_keep_target the loss uses only the answer positions
  effective_batch_size: 16
  save_every_steps: 25            # a full run is about 5 hours; keep checkpoints close together
  log_every_steps: 5
